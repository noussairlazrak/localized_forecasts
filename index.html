<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Localized Forecasts has moved to a new home. Now managed by GEOS-ESM - Goddard Earth Observing System.">
    <meta name="keywords" content="GEOS-ESM, NASA, Localized Forecasts, GEOS-CF">
    <title>Localized Forecasts - Redirecting</title>
    <link rel="apple-touch-icon" sizes="180x180" href="./parametres/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./parametres/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./parametres/favicon-16x16.png">
    <meta name="theme-color" content="#000000">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000000;
            color: #ffffff;
            overflow-x: hidden;
        }

        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #000000;
            overflow: hidden;
        }

        .earth-container {
            position: absolute;
            top: 50%;
            right: -5%;
            transform: translateY(-50%);
            width: 70%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        #earth-canvas {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.5rem 3rem;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo svg {
            width: 50px;
            height: 50px;
        }

        .logo span {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .nav-icon {
            width: 24px;
            height: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
        }

        .nav-icon span {
            width: 100%;
            height: 2px;
            background: #ffffff;
        }

        .content {
            position: absolute;
            left: 5%;
            top: 50%;
            transform: translateY(-50%);
            max-width: 550px;
            z-index: 10;
        }

        .main-title {
            font-size: 4rem;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .description {
            font-size: 1rem;
            font-weight: 300;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 2.5rem;
            max-width: 480px;
        }

        .cta-button {
            display: inline-flex;
            align-items: center;
            gap: 1rem;
            background: transparent;
            color: white;
            text-decoration: none;
            padding: 1rem 1.75rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .cta-button:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #ffffff;
        }

        .cta-button svg {
            width: 16px;
            height: 16px;
            transition: transform 0.3s ease;
        }

        .cta-button:hover svg {
            transform: translateX(4px);
        }

        .badge {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .footer-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 2rem;
            padding: 1.5rem;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            z-index: 100;
        }

        .footer-nav a {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            letter-spacing: 0.5px;
            transition: color 0.3s ease;
        }

        .footer-nav a:hover {
            color: #ffffff;
        }

        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            opacity: 0.4;
        }

        @media (max-width: 1024px) {
            .earth-container {
                right: -20%;
            }
            .earth {
                width: 600px;
                height: 600px;
            }
            .atmosphere {
                width: 650px;
                height: 650px;
            }
        }

        @media (max-width: 768px) {
            .main-title {
                font-size: 2.5rem;
            }
            .content {
                left: 5%;
                right: 5%;
                max-width: none;
            }
            .earth-container {
                right: -40%;
                opacity: 0.5;
            }
            .header {
                padding: 1rem 1.5rem;
            }
        }
    </style>
</head>

<body>
    <section class="hero">
        <div class="stars">
            <div class="star" style="top: 5%; left: 10%;"></div>
            <div class="star" style="top: 12%; left: 25%;"></div>
            <div class="star" style="top: 8%; left: 45%;"></div>
            <div class="star" style="top: 20%; left: 5%;"></div>
            <div class="star" style="top: 35%; left: 15%;"></div>
            <div class="star" style="top: 45%; left: 8%;"></div>
            <div class="star" style="top: 60%; left: 3%;"></div>
            <div class="star" style="top: 75%; left: 12%;"></div>
            <div class="star" style="top: 85%; left: 25%;"></div>
            <div class="star" style="top: 15%; left: 35%;"></div>
            <div class="star" style="top: 28%; left: 42%;"></div>
            <div class="star" style="top: 5%; left: 60%;"></div>
            <div class="star" style="top: 92%; left: 40%;"></div>
        </div>


        <div class="content">
            <div class="badge">Repository Relocated</div>
            <h1 class="main-title">Localized Forecasts</h1>
            <p class="description">
                This project is now managed by GEOS-ESM (Goddard Earth Observing System - Earth System Modeling). 
                The repository has been transferred to provide better support and continued development.
            </p>
            <a href="https://geos-esm.github.io/SNWG_Localized_Forecasts/" class="cta-button">
                Explore
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/>
                </svg>
            </a>
        </div>

        <div class="earth-container">
            <canvas id="earth-canvas"></canvas>
        </div>

        <nav class="footer-nav">
            <a href="https://geos-esm.github.io/SNWG_Localized_Forecasts/">New Repo</a>
            <a href="https://github.com/GEOS-ESM">GitHub</a>
            <a href="https://gmao.gsfc.nasa.gov/">NASA GMAO</a>
            <a href="https://geos-esm.github.io/">GEOS-ESM</a>
            <a href="https://marroninstitute.nyu.edu/">NYU Marron Institute</a>
        </nav>
    </section>

    <script>
        const container = document.getElementById('earth-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 2.5;

        const renderer = new THREE.WebGLRenderer({ canvas: container, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        const ambientLight = new THREE.AmbientLight(0x333333, 1);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(5, 3, 5);
        scene.add(directionalLight);

        const textureLoader = new THREE.TextureLoader();
        const earthTexture = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');
        const bumpMap = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-topology.png');
        const specularMap = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-water.png');

        const earthGeometry = new THREE.SphereGeometry(1, 64, 64);
        const earthMaterial = new THREE.MeshPhongMaterial({
            map: earthTexture,
            bumpMap: bumpMap,
            bumpScale: 0.05,
            specularMap: specularMap,
            specular: new THREE.Color(0x333333),
            shininess: 5
        });
        const earth = new THREE.Mesh(earthGeometry, earthMaterial);
        scene.add(earth);

        const atmosphereGeometry = new THREE.SphereGeometry(1.02, 64, 64);
        const atmosphereMaterial = new THREE.MeshPhongMaterial({
            color: 0x88ccff,
            transparent: true,
            opacity: 0.15,
            side: THREE.BackSide
        });
        const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
        scene.add(atmosphere);

        const cloudGeometry = new THREE.SphereGeometry(1.01, 64, 64);
        const cloudTexture = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-clouds.png');
        const cloudMaterial = new THREE.MeshPhongMaterial({
            map: cloudTexture,
            transparent: true,
            opacity: 0.4
        });
        const clouds = new THREE.Mesh(cloudGeometry, cloudMaterial);
        scene.add(clouds);

        function animate() {
            requestAnimationFrame(animate);
            earth.rotation.y += 0.001;
            clouds.rotation.y += 0.0012;
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
